services:
  - type: web
    name: satvik-spot-backend-staging
    env: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    branch: main
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 8080
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: CORS_ALLOWED_ORIGINS
        value: https://satvik-spot-staging.web.app,https://satvik-spot-staging-admin.web.app,http://localhost:3000,http://127.0.0.1:3000
      - key: COMMERCE_ENABLED
        value: "false"
      - key: CHECKOUT_ENABLED
        value: "false"
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: MARKETPLACE_AMAZON_ENABLED
        value: "false"
      - key: MARKETPLACE_FLIPKART_ENABLED
        value: "false"
      - key: FSSAI_STATUS
        value: pending
      - key: GST_STATUS
        value: pending
      - key: PUBLIC_INDEXING_ENABLED
        value: "false"
