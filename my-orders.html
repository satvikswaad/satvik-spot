<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders – Satwik Sweets and Pickels</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--green-dark);
            margin-bottom: 24px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 12px
        }

        .order-card {
            background: #fff;
            border: 1px solid #e8f4ec;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .05)
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 12px;
            margin-bottom: 12px
        }

        .order-status {
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            text-transform: uppercase
        }

        .status-Pending {
            background: #fff3cd;
            color: #856404
        }

        .status-Shipped {
            background: #d1ecf1;
            color: #0c5460
        }

        .status-Delivered {
            background: #d4edda;
            color: #155724
        }

        .status-Cancelled {
            background: #f8d7da;
            color: #721c24
        }

        .lookup-box {
            background: #f9f9f9;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 40px
        }

        .lookup-box input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 200px
        }

        .lookup-box button {
            padding: 10px 20px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer
        }
    </style>
</head>

<body>

    <nav>
        <a class="nav-logo" href="index.html">
            <span class="nav-brand">Satwik <span>Sweets and Pickels</span></span>
        </a>
    </nav>

    <div class="container">
        <h1>📦 Track Your Orders</h1>

        <div class="lookup-box" id="lookup-box">
            <p>Enter your phone number to check order status:</p><br />
            <input type="tel" id="lookup-phone" placeholder="Mobile Number" />
            <button onclick="lookupOrders()">Check Status</button>
        </div>

        <div id="orders-list"></div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Auto-load from logged-in session
        const sessionUser = JSON.parse(localStorage.getItem('satwikUser') || 'null');

        if (!sessionUser) {
            // If no local user, wait for Auth listener or redirect
            // For now, redirect to login if not found
            // But let's check auth state first just in case
        } else {
            if (document.getElementById('lookup-phone'))
                document.getElementById('lookup-phone').value = (sessionUser.phone || '');
            // Auto lookup if phone is present
            if (sessionUser.phone) setTimeout(lookupOrders, 500);
        }

        window.lookupOrders = async function () {
            const phone = document.getElementById('lookup-phone').value.trim();
            if (!phone || phone.length < 10) { alert('Enter valid phone number'); return; }

            const list = document.getElementById('orders-list');
            list.innerHTML = '<p class="text-center p-40 text-gray">🔍 Loading your orders...</p>';

            try {
                const { collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

                // Wait for Firebase
                let retries = 0;
                while (!window.db && retries < 10) {
                    await new Promise(r => setTimeout(r, 500));
                    retries++;
                }
                if (!window.db) {
                    list.innerHTML = '<p class="text-red text-center">Could not connect to server. Please refresh.</p>';
                    return;
                }

                // Simple query — no compound index needed
                const q = query(
                    collection(window.db, 'orders'),
                    where('phone', '==', phone)
                );

                const snap = await getDocs(q);

                if (snap.empty) {
                    list.innerHTML = '<p class="text-center text-muted p-20">No orders found for this number.</p>';
                    return;
                }

                // Sort client-side by date (newest first)
                const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                orders.sort((a, b) => {
                    const dateA = a.createdAt?.toDate?.() || new Date(0);
                    const dateB = b.createdAt?.toDate?.() || new Date(0);
                    return dateB - dateA;
                });

                list.innerHTML = '';
                orders.forEach(o => {
                    let itemsDisplay = '';
                    if (Array.isArray(o.items)) {
                        itemsDisplay = o.items.map(i => `${i.name} x${i.qty}`).join(', ');
                    } else {
                        itemsDisplay = o.items || '';
                    }

                    const div = document.createElement('div');
                    div.className = 'order-card';
                    div.innerHTML = `
                        <div class="order-header">
                          <div>
                            <strong>Order #${o.id.slice(-6).toUpperCase()}</strong><br>
                            <span class="text-xs text-muted">${o.date || ''}</span>
                          </div>
                          <div><span class="order-status status-${o.status}">${o.status}</span></div>
                        </div>
                        <div>
                          <p><strong>Items:</strong> <span class="text-sm text-black-50">${itemsDisplay}</span></p>
                          <p class="mt-8"><strong>Total:</strong> ₹${o.total} (${o.payment})</p>
                        </div>`;
                    list.appendChild(div);
                });

            } catch (e) {
                console.error(e);
                list.innerHTML = `<p class="text-red text-center">Error: ${e.message}</p>`;
            }
        }
    </script>
    <!-- Firebase SDK -->
    <script type="module" src="./firebase-config.js"></script>
</body>

</html>
