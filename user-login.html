<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login – Satwik Sweets and Pickels</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --green: #1B6B2E;
            --green-dark: #0F4A1E;
            --gold: #C9A227;
            --dark: #0D1F12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #1B6B2E 0%, #0F4A1E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px
        }

        .login-box {
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
            text-align: center
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--gold);
            margin: 0 auto 16px;
            box-shadow: 0 4px 16px rgba(201, 162, 39, .3)
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--green-dark);
            margin-bottom: 6px
        }

        .sub {
            color: #888;
            font-size: 13px;
            margin-bottom: 28px
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--green-dark);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #C5E8CE;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Lato', sans-serif;
            color: var(--dark);
            background: #F7FDF9;
            transition: border-color .2s
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--green)
        }

        .login-btn {
            width: 100%;
            background: var(--gold);
            color: var(--dark);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s, background .2s;
            margin-top: 8px
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: #d4ae2f
        }

        .guest-btn {
            display: block;
            margin-top: 16px;
            color: #888;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%
        }

        .guest-btn:hover {
            color: var(--green)
        }

        .error-msg {
            display: none;
            color: #c0392b;
            font-size: 12px;
            margin-top: 12px;
            font-weight: 700
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="logo-circle">
            <img src="assets/logo.png" onerror="this.src='https://placehold.co/100x100?text=Logo'" alt="Satwik Sweets and Pickels" />
        </div>
        <h1>Login / Register</h1>
        <p class="sub">Enter your details to track orders & save cart</p>

        <!-- LOGIN FORM -->
        <div id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="l-email" placeholder="you@example.com" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="l-pass" placeholder="••••••••" />
            </div>
            <button class="login-btn" onclick="handleLogin()">Login →</button>
            <p class="mt-16 text-sm text-muted">
                New user? <a href="#" onclick="toggleForm()" class="text-green font-bold">Register
                    here</a>
            </p>
            <div class="error-msg" id="l-err"></div>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" class="d-none">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="r-name" placeholder="E.g. Rahul Kumar" />
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="r-email" placeholder="you@example.com" />
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="r-phone" placeholder="10-digit mobile number" maxlength="10" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="r-pass" placeholder="Create a password" />
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="r-pass2" placeholder="Repeat password" />
            </div>
            <button class="login-btn" onclick="handleRegister()">Register & Login →</button>
            <p class="mt-16 text-sm text-muted">
                Already have an account? <a href="#" onclick="toggleForm()"
                    class="text-green font-bold">Login here</a>
            </p>
            <div class="error-msg" id="r-err"></div>
            <div id="r-ok" class="d-none text-green font-bold mt-10">✅ Registered! Redirecting...
            </div>
        </div>

        <button class="guest-btn" onclick="window.location.href='index.html'">Continue as Guest</button>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="./firebase-config.js"></script>

    <script type="module">
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword }
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc, getDoc }
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Check if already logged in
        if (localStorage.getItem('satwikUser')) {
            window.location.href = 'index.html';
        }

        window.toggleForm = function () {
            const l = document.getElementById('login-form');
            const r = document.getElementById('register-form');
            l.classList.toggle('d-none');
            r.classList.toggle('d-none');
        }

        window.handleLogin = async function () {
            const email = document.getElementById('l-email').value.trim();
            const pass = document.getElementById('l-pass').value.trim();
            const err = document.getElementById('l-err');
            err.classList.add('d-none');

            if (!email || !pass) { 
                err.textContent = 'Fill all fields'; 
                err.classList.remove('d-none'); 
                return; 
            }

            try {
                const cred = await signInWithEmailAndPassword(window.auth, email, pass);
                const user = cred.user;

                // Save basic user data to localStorage IMMEDIATELY
                let userData = { uid: user.uid, email: user.email, name: user.email.split('@')[0] };
                localStorage.setItem('satwikUser', JSON.stringify(userData));

                // Try to enrich with Firestore data (won't block login if offline)
                try {
                    const snap = await getDoc(doc(window.db, 'users', user.uid));
                    if (snap.exists()) {
                        userData = { uid: user.uid, email: user.email, ...snap.data() };
                        localStorage.setItem('satwikUser', JSON.stringify(userData));
                    }
                } catch (fsErr) {
                    console.warn('Firestore fetch skipped (offline?):', fsErr.message);
                }

                window.location.href = 'index.html';
            } catch (e) {
                console.error(e);
                let msg = e.message;
                if (e.code === 'auth/invalid-credential') msg = 'Invalid email or password';
                if (e.code === 'auth/user-not-found') msg = 'No account found with this email';
                if (e.code === 'auth/wrong-password') msg = 'Incorrect password';
                if (e.code === 'auth/too-many-requests') msg = 'Too many attempts. Try later';
                err.textContent = '❌ ' + msg;
                err.style.display = 'block';
            }
        }

        window.handleRegister = async function () {
            const name = document.getElementById('r-name').value.trim();
            const email = document.getElementById('r-email').value.trim();
            const phone = document.getElementById('r-phone').value.trim();
            const pass = document.getElementById('r-pass').value.trim();
            const pass2 = document.getElementById('r-pass2').value.trim();
            const err = document.getElementById('r-err');
            err.style.display = 'none';

            if (!name || !email || !phone || !pass) { err.textContent = 'Fill all fields'; err.style.display = 'block'; return; }
            if (pass !== pass2) { err.textContent = 'Passwords do not match!'; err.style.display = 'block'; return; }

            try {
                const cred = await createUserWithEmailAndPassword(window.auth, email, pass);
                const userData = { uid: cred.user.uid, name, phone, email };

                // Save to localStorage IMMEDIATELY
                localStorage.setItem('satwikUser', JSON.stringify(userData));

                // Try to save to Firestore (won't block registration if offline)
                try {
                    await setDoc(doc(window.db, 'users', cred.user.uid), { name, phone, email, createdAt: new Date() });
                } catch (fsErr) {
                    console.warn('Firestore save skipped (offline?):', fsErr.message);
                }

                document.getElementById('r-ok').style.display = 'block';
                setTimeout(() => window.location.href = 'index.html', 1200);
            } catch (e) {
                console.error(e);
                let msg = e.message;
                if (e.code === 'auth/email-already-in-use') msg = 'Email already registered!';
                if (e.code === 'auth/weak-password') msg = 'Password must be at least 6 characters';
                err.textContent = '❌ ' + msg;
                err.style.display = 'block';
            }
        }
    </script>

</body>

</html>
